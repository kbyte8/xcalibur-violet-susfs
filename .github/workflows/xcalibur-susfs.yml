name: Xcalibur Violet - Historical KernelSU + SUSFS 4.14

on:
  workflow_dispatch:

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r416183b"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  KERNEL_BUILD_TIME: "2026-09-30T01:25:49+01:00"
  KSU_SOURCE: "https://github.com/Justadeayo/KernelSU"
  KSU_BUILD_TIME: "2026-09-30T01:25:49+01:00"
  SUSFS_PATCH_SOURCE: "https://github.com/sanba0519/Kernel-patch"
  SUSFS_PATCH_TIME: "2026-09-11T09:36:41+01:00"
  DEFCONFIG_NAME: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  KERNEL_NAME: "Xcalibur-violet-KernelSU-SUSFS"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: |
          mkdir -p diagnostics
          {
            echo "workflow=v7-historical-kernelsu-susfs"
            echo "kernel_source=${KERNEL_SOURCE}"
            echo "kernel_branch=${KERNEL_BRANCH}"
            echo "kernel_before=${KERNEL_BUILD_TIME}"
            echo "ksu_source=${KSU_SOURCE}"
            echo "ksu_before=${KSU_BUILD_TIME}"
            echo "susfs_patch_source=${SUSFS_PATCH_SOURCE}"
            echo "susfs_patch_before=${SUSFS_PATCH_TIME}"
          } > diagnostics/build-plan.txt

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xcalibur-violet-historical-ksu-susfs-v7
          max-size: 5G

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="10" -o Acquire::Retries="2" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential \
            lz4 git python3 curl dwarves cpio lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip patch

      - name: Checkout Sep-30-era Xcalibur source
        run: |
          set -euo pipefail
          rm -rf kernel
          git clone --filter=blob:none --no-checkout "${KERNEL_SOURCE}" kernel
          cd kernel
          git fetch --force origin "${KERNEL_BRANCH}:refs/remotes/origin/${KERNEL_BRANCH}"
          KERNEL_SHA="$(git rev-list -1 --before="${KERNEL_BUILD_TIME}" "origin/${KERNEL_BRANCH}")"
          if [ -z "$KERNEL_SHA" ]; then
            echo "::error::Could not resolve historical kernel commit"
            exit 1
          fi
          git checkout --detach "$KERNEL_SHA"
          echo "KERNEL_SOURCE_SHA=$KERNEL_SHA" >> "$GITHUB_ENV"
          {
            echo "kernel_source_sha=$KERNEL_SHA"
            echo "kernel_commit=$(git show -s --format='%cI | %s' "$KERNEL_SHA")"
            echo "kernel_version=$(make kernelversion)"
          } >> ../diagnostics/build-plan.txt
          git show -s --format=fuller "$KERNEL_SHA" | tee ../diagnostics/kernel-commit.txt
          make kernelversion

      - name: Download Sep-30 Clang
        run: |
          set -euo pipefail
          mkdir -p "toolchains/${CLANG_VERSION}"
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "toolchains/${CLANG_VERSION}"
          test -x "toolchains/${CLANG_VERSION}/bin/clang"
          "toolchains/${CLANG_VERSION}/bin/clang" --version | head -n1 | tee diagnostics/clang.txt

      - name: Integrate Sep-30-era Justadeayo KernelSU
        run: |
          set -euo pipefail
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --filter=blob:none "${KSU_SOURCE}" KernelSU
          KSU_SHA="$(git -C KernelSU rev-list -1 --before="${KSU_BUILD_TIME}" origin/master)"
          if [ -z "$KSU_SHA" ]; then
            echo "::error::Could not resolve historical KernelSU commit"
            exit 1
          fi
          git -C KernelSU checkout --detach "$KSU_SHA"
          echo "KSU_SHA=$KSU_SHA" >> "$GITHUB_ENV"

          ln -s ../KernelSU/kernel drivers/kernelsu
          if ! grep -qE '^[[:space:]]*obj-\$\(CONFIG_KSU\).*kernelsu/' drivers/Makefile; then
            printf '\n# KernelSU\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          fi

          {
            echo "ksu_sha=$KSU_SHA"
            echo "ksu_commit=$(git -C KernelSU show -s --format='%cI | %s' "$KSU_SHA")"
            echo "===== KernelSU Makefile version lines ====="
            grep -nE 'KSU_VERSION|VERSION_TAG' KernelSU/kernel/Makefile KernelSU/Makefile 2>/dev/null || true
            echo "===== Existing SUSFS Kconfig before historical patch ====="
            grep -Rns 'config KSU_SUSFS' KernelSU/kernel 2>/dev/null || true
          } | tee ../diagnostics/kernelsu-historical.txt

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile -o -f drivers/kernelsu/Kbuild

      - name: Recover maintainer historical SUSFS 4.14 patch
        run: |
          set -euo pipefail
          rm -rf historical-susfs-patch
          git clone --filter=blob:none "${SUSFS_PATCH_SOURCE}" historical-susfs-patch
          PATCH_SHA="$(git -C historical-susfs-patch rev-list -1 --before="${SUSFS_PATCH_TIME}" origin/main 2>/dev/null || true)"
          if [ -z "$PATCH_SHA" ]; then
            PATCH_SHA="$(git -C historical-susfs-patch rev-list -1 --before="${SUSFS_PATCH_TIME}" origin/master 2>/dev/null || true)"
          fi
          if [ -z "$PATCH_SHA" ]; then
            echo "::error::Could not resolve historical sanba0519/Kernel-patch commit"
            exit 1
          fi
          git -C historical-susfs-patch checkout --detach "$PATCH_SHA"
          echo "SUSFS_PATCH_SHA=$PATCH_SHA" >> "$GITHUB_ENV"

          PATCH_FILE="historical-susfs-patch/susfs_patch_to_4.14.patch"
          if [ ! -s "$PATCH_FILE" ]; then
            echo "::error::Historical repo does not contain susfs_patch_to_4.14.patch"
            find historical-susfs-patch -maxdepth 2 -type f -print > diagnostics/historical-patch-files.txt
            exit 1
          fi
          cp "$PATCH_FILE" susfs-historical-4.14.patch
          {
            echo "patch_sha=$PATCH_SHA"
            git -C historical-susfs-patch show -s --format='%cI | %s' "$PATCH_SHA"
            echo "===== files touched by patch ====="
            grep '^+++ ' susfs-historical-4.14.patch || true
          } | tee diagnostics/historical-susfs-patch.txt
          sha256sum susfs-historical-4.14.patch > diagnostics/historical-susfs-patch.sha256

      - name: Apply maintainer historical KernelSU SUSFS patch
        run: |
          set -euo pipefail
          cd kernel
          set +e
          patch -p1 --forward --batch < ../susfs-historical-4.14.patch 2>&1 | tee ../susfs-historical-apply.log
          PATCH_RC=${PIPESTATUS[0]}
          set -e

          find . -name '*.rej' -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; \
            > ../diagnostics/historical-patch-rejects.txt || true

          if [ "$PATCH_RC" -ne 0 ]; then
            mapfile -t rejects < <(find . -name '*.rej' -print | sort)
            echo "Historical patch returned $PATCH_RC; rejects: ${rejects[*]:-none}"

            # The Xcalibur branch can differ in these two proc files. Only auto-fix
            # the same two layout conflicts we already observed in previous runs.
            if [ "${#rejects[@]}" -eq 2 ] && \
               [ "${rejects[0]}" = './fs/proc/cmdline.c.rej' ] && \
               [ "${rejects[1]}" = './fs/proc/task_mmu.c.rej' ]; then
              python3 - <<'PYFIX'
          from pathlib import Path

          p = Path('fs/proc/cmdline.c')
          s = p.read_text()
          decls = '''
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;
          extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
          #endif
          '''
          if 'susfs_is_fake_cmdline_or_bootconfig_buffer_set' not in s:
              anchor = '#include <asm/setup.h>\n'
              if anchor not in s:
                  raise SystemExit('cmdline.c include anchor missing')
              s = s.replace(anchor, anchor + decls, 1)
          spoof = '''#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          \tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {
          \t\tsusfs_spoof_cmdline_or_bootconfig(m);
          \t\tseq_putc(m, '\\n');
          \t\treturn 0;
          \t}
          #endif
          '''
          fn = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
          if 'susfs_spoof_cmdline_or_bootconfig(m);' not in s:
              if fn not in s:
                  raise SystemExit('cmdline_proc_show anchor missing')
              s = s.replace(fn, fn + spoof, 1)
          p.write_text(s)

          p = Path('fs/proc/task_mmu.c')
          s = p.read_text()
          inc = '''#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
          #include <linux/susfs_def.h>
          #endif
          '''
          if '#include <linux/susfs_def.h>' not in s:
              anchor = '#include <linux/ctype.h>\n'
              if anchor not in s:
                  raise SystemExit('task_mmu.c include anchor missing')
              s = s.replace(anchor, anchor + inc, 1)
          p.write_text(s)
          PYFIX
              rm -f fs/proc/cmdline.c.rej fs/proc/task_mmu.c.rej
            else
              echo "::error::Historical maintainer patch has unexpected rejects"
              exit 1
            fi
          fi

          REMAINING="$(find . -name '*.rej' -print)"
          if [ -n "$REMAINING" ]; then
            echo "::error::Reject files remain after historical patch"
            echo "$REMAINING"
            exit 1
          fi

          if ! grep -Rqs 'config KSU_SUSFS' KernelSU/kernel drivers/kernelsu; then
            echo "::error::Historical patch did not add CONFIG_KSU_SUSFS to this KernelSU tree"
            exit 1
          fi
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          SUSFS_VERSION_LINE="$(grep -E '^#define[[:space:]]+SUSFS_VERSION' include/linux/susfs.h | head -n1 || true)"
          echo "$SUSFS_VERSION_LINE" | tee ../diagnostics/susfs-version.txt

          {
            echo "===== SUSFS Kconfig after historical patch ====="
            grep -Rns 'KSU_SUSFS' KernelSU/kernel/Kconfig drivers/kernelsu/Kconfig 2>/dev/null || true
            echo "===== KernelSU hook symbols after patch ====="
            grep -RhoE 'ksu_handle_[A-Za-z0-9_]+' KernelSU/kernel 2>/dev/null | sort -u || true
          } > ../diagnostics/kernelsu-after-historical-susfs.txt

      - name: Configure same Sep-30 hooks plus SUSFS
        run: |
          set -euo pipefail
          cd kernel
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"
          test -f "$DEFCONFIG"

          set_y() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=y" >> "$DEFCONFIG"
          }
          set_n() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "# ${key} is not set" >> "$DEFCONFIG"
          }
          ksu_symbol_exists() {
            local sym="${1#CONFIG_}"
            grep -RqsE "^[[:space:]]*(menu)?config[[:space:]]+${sym}([[:space:]]|$)" KernelSU/kernel
          }
          set_y_if_exists() { if ksu_symbol_exists "$1"; then set_y "$1"; fi; }
          set_n_if_exists() { if ksu_symbol_exists "$1"; then set_n "$1"; fi; }

          # Exact settings appended by the known-good Sep-30 v3.3.0-18 builder.
          set_y CONFIG_KSU
          set_y CONFIG_KPROBES
          set_y CONFIG_KPROBE_EVENTS
          set_y CONFIG_KSU_KPROBE_HOOKS
          set_y CONFIG_OVERLAY_FS
          set_y CONFIG_KSU_TAMPER_SYSCALL_TABLE

          # Historical maintainer workflow added this one base SUSFS flag.
          set_y CONFIG_KSU_SUSFS

          # Enable hiding features only when that historical KSU patch exposes them.
          set_y_if_exists CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_PATH
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_KSTAT
          set_y_if_exists CONFIG_KSU_SUSFS_TRY_UMOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SPOOF_UNAME
          set_y_if_exists CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          set_y_if_exists CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          set_y_if_exists CONFIG_KSU_SUSFS_OPEN_REDIRECT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_MAP
          set_n_if_exists CONFIG_KSU_SUSFS_ENABLE_LOG
          set_n_if_exists CONFIG_KSU_SUSFS_SUS_SU

          tail -n 100 "$DEFCONFIG" > ../diagnostics/defconfig-tail.txt

      - name: Compile kernel
        run: |
          set -euo pipefail
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${CLANG_VERSION}/bin"
          export PATH="/usr/lib/ccache:${CLANG_ROOT}:$PATH"
          export CC="ccache ${CLANG_ROOT}/clang"
          export CXX="ccache ${CLANG_ROOT}/clang++"
          export HOSTCC="ccache ${CLANG_ROOT}/clang"
          export HOSTCXX="ccache ${CLANG_ROOT}/clang++"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          mkdir -p out
          touch ./.scmversion
          make O=out "${DEFCONFIG_NAME}" CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out olddefconfig CLANG_TRIPLE=aarch64-linux-gnu-
          cp out/.config ../diagnostics/final.config

          echo "===== Final KSU / SUSFS config ====="
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBE_HOOKS|CONFIG_KSU_TAMPER_SYSCALL_TABLE|CONFIG_KPROBES|CONFIG_OVERLAY_FS)' out/.config || true
          echo "===================================="

          for key in CONFIG_KSU CONFIG_KPROBES CONFIG_KPROBE_EVENTS CONFIG_KSU_KPROBE_HOOKS CONFIG_OVERLAY_FS CONFIG_KSU_TAMPER_SYSCALL_TABLE CONFIG_KSU_SUSFS; do
            grep -q "^${key}=y$" out/.config || { echo "::error::${key}=y missing"; exit 1; }
          done

          set +e
          make -j"$(nproc)" O=out CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Kernel compilation failed"
            exit "$status"
          fi

      - name: Verify built image contains KernelSU and SUSFS
        run: |
          set -euo pipefail
          BOOT_DIR="kernel/out/arch/arm64/boot"
          test -s "${BOOT_DIR}/Image.gz"
          gzip -dc "${BOOT_DIR}/Image.gz" > built-Image
          {
            echo "===== kernel banner ====="
            strings built-Image | grep -m1 'Linux version' || true
            echo "===== SUSFS markers ====="
            strings built-Image | grep -Ei -m30 'susfs is initialized|susfs_show_version|susfs_add_sus_path|susfs_add_sus_map|SUSFS_VERSION' || true
            echo "===== KernelSU markers ====="
            strings built-Image | grep -Ei -m30 'KernelSU:|selinux_hide|KSU ioctl' || true
          } | tee diagnostics/built-image-markers.txt

          strings built-Image | grep -q 'susfs' || { echo "::error::No SUSFS marker in built image"; exit 1; }
          strings built-Image | grep -q 'KernelSU:' || { echo "::error::No KernelSU marker in built image"; exit 1; }

      - name: Package with proven Sep-30 DTB DTBO and installer
        run: |
          set -euo pipefail
          rm -rf package
          cp -a known-good-sep30 package
          cp kernel/out/arch/arm64/boot/Image.gz package/Image.gz

          echo '5c48d4b4d2112c9af8a2f9b543996bb410eb6ddc6a2fd65c02101a46b8e68569  package/dtb' | sha256sum -c -
          echo '1cb8c6023fee3a1a75624129bff66552e165e2328903a8fbefe68306253d77ad  package/dtbo.img' | sha256sum -c -

          SUSFS_VER="$(sed -n 's/.*SUSFS_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' diagnostics/susfs-version.txt | head -n1)"
          [ -n "$SUSFS_VER" ] || SUSFS_VER="unknown"
          ZIP_NAME="${KERNEL_NAME}_${SUSFS_VER}_$(date +'%Y%m%d_%H%M')"
          (cd package && zip -r9 "../${ZIP_NAME}.zip" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          sha256sum "${ZIP_NAME}.zip" | tee "${ZIP_NAME}.sha256"
          cp kernel/out/.config "${ZIP_NAME}.config"

          printf '%s\n' \
            "kernel_source=${KERNEL_SOURCE}" \
            "kernel_ref=${KERNEL_BRANCH}" \
            "kernel_source_sha=${KERNEL_SOURCE_SHA}" \
            "ksu_repo=${KSU_SOURCE}" \
            "ksu_sha=${KSU_SHA}" \
            "susfs_patch_repo=${SUSFS_PATCH_SOURCE}" \
            "susfs_patch_sha=${SUSFS_PATCH_SHA}" \
            "compiler=${CLANG_VERSION}" \
            "known_good_sep30_package_sha256=858e34f51bbef6ae9ae5e9fbdc1571b91845eca0cd2ad1800a7bad281d33b569" \
            > "${ZIP_NAME}.provenance.txt"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-violet-historical-kernelsu-susfs
          path: |
            ${{ env.ZIP_NAME }}.zip
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.ZIP_NAME }}.config
            ${{ env.ZIP_NAME }}.provenance.txt
            diagnostics/built-image-markers.txt
            diagnostics/susfs-version.txt

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          cp susfs-historical-apply.log diagnostics/ 2>/dev/null || true
          cp susfs-historical-4.14.patch diagnostics/ 2>/dev/null || true
          cp build.log diagnostics/ 2>/dev/null || true
          find kernel -name '*.rej' -exec cp --parents '{}' diagnostics/ \; 2>/dev/null || true
          find kernel -name '*.orig' -exec cp --parents '{}' diagnostics/ \; 2>/dev/null || true
          find diagnostics -maxdepth 6 -type f -printf '%p\n' | sort

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-susfs-failure-logs
          path: diagnostics/
          if-no-files-found: error
