name: Xcalibur Violet SUSFS Autopilot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/Justadeayo/android_kernel_xiaomi_violet
  KERNEL_BRANCH: "17"
  DEFCONFIG: vendor/violet-perf_defconfig
  CLANG_VERSION: clang-r416183b
  SUSFS_PATCH_COMMIT: e2f895b
  DEVICE: violet

jobs:
  build:
    name: BakaSU ${{ matrix.bakasu_ref }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        bakasu_ref:
          - v4.2.0-rc3
          - main

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          : > diagnostics/summary.txt
          echo "bakasu_ref=${{ matrix.bakasu_ref }}" >> diagnostics/summary.txt

      - name: Install build dependencies
        shell: bash
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="10" -o Acquire::Retries="2" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential \
            git python3 curl cpio lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip patch xz-utils

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xcalibur-bakasu-${{ matrix.bakasu_ref }}
          max-size: 5G

      - name: Clone Xcalibur source and pin to Sep-30-era state
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          # Use the last branch-17 commit at/before the known working Sep-30 build time.
          TARGET_SHA="$(git rev-list -1 --before='2026-09-30 01:25:49 +0100' "origin/$KERNEL_BRANCH")"
          if [ -z "$TARGET_SHA" ]; then
            echo "Could not resolve Sep-30-era kernel commit" >&2
            exit 1
          fi
          git checkout "$TARGET_SHA"
          echo "KERNEL_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          {
            echo "kernel_sha=$TARGET_SHA"
            echo "kernel_version=$(make kernelversion)"
          } >> "$GITHUB_WORKSPACE/diagnostics/summary.txt"

      - name: Download Sep-30 compiler family
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p toolchains
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "toolchains/$CLANG_VERSION"
          "toolchains/$CLANG_VERSION/bin/clang" --version | head -n 1 | tee diagnostics/clang.txt

      - name: Integrate BakaSU
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${{ matrix.bakasu_ref }}/kernel/setup.sh" \
            -o setup-bakasu.sh
          bash setup-bakasu.sh "${{ matrix.bakasu_ref }}" 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/bakasu-setup.log"

          test -e drivers/kernelsu
          REAL_KSU="$(readlink -f drivers/kernelsu || true)"
          echo "bakasu_real_path=$REAL_KSU" >> "$GITHUB_WORKSPACE/diagnostics/summary.txt"
          grep -R "config KSU_SUSFS" -n drivers/kernelsu/Kconfig | tee "$GITHUB_WORKSPACE/diagnostics/bakasu-kconfig.txt"

      - name: Apply SUSFS 4.14 kernel-side backport
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          PATCH_BASE="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_COMMIT}/Patches"
          curl -fL --retry 3 "${PATCH_BASE}/Patch/susfs_patch_to_4.14.patch" -o ../susfs-4.14.patch

          set +e
          patch -p1 --forward --batch < ../susfs-4.14.patch 2>&1 | tee ../diagnostics/susfs-main-patch.log
          PATCH_RC=${PIPESTATUS[0]}
          set -e

          # Xcalibur has known small layout differences. Handle only known rejects;
          # abort on anything else so a bad kernel is never packaged.
          mapfile -t rejects < <(find . -name '*.rej' -print | sort)
          printf '%s\n' "${rejects[@]}" > ../diagnostics/rejects.txt

          if [ "$PATCH_RC" -ne 0 ]; then
            python3 - <<'PYFIX'
          from pathlib import Path
          import sys

          rejects = sorted(Path('.').rglob('*.rej'))
          allowed = {
              Path('fs/proc/cmdline.c.rej'),
              Path('fs/proc/task_mmu.c.rej'),
              Path('fs/namei.c.rej'),
              Path('fs/notify/fdinfo.c.rej'),
              Path('kernel/sys.c.rej'),
          }
          bad = [p for p in rejects if p not in allowed]
          if bad:
              print('Unexpected rejects:', *bad, sep='\n', file=sys.stderr)
              sys.exit(2)

          # cmdline.c: keep Xcalibur's existing cmdline logic and add SUSFS override first.
          p = Path('fs/proc/cmdline.c')
          if p.exists():
              s = p.read_text()
              if 'susfs_spoof_cmdline_or_bootconfig' not in s:
                  anchor = '#include <asm/setup.h>\n'
                  decl = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                          'extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n'
                          'extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n'
                          '#endif\n')
                  if anchor in s:
                      s = s.replace(anchor, anchor + decl, 1)
                  fn = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
                  body = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                          '\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n'
                          '\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n'
                          "\t\tseq_putc(m, '\\n');\n"
                          '\t\treturn 0;\n'
                          '\t}\n'
                          '#endif\n')
                  if fn in s:
                      s = s.replace(fn, fn + body, 1)
                  p.write_text(s)

          # task_mmu.c: add SUSFS definitions include if absent.
          p = Path('fs/proc/task_mmu.c')
          if p.exists():
              s = p.read_text()
              if '#include <linux/susfs_def.h>' not in s:
                  for anchor in ('#include <linux/ctype.h>\n', '#include <linux/mm.h>\n'):
                      if anchor in s:
                          inc = ('#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
                                 '#include <linux/susfs_def.h>\n'
                                 '#endif\n')
                          s = s.replace(anchor, anchor + inc, 1)
                          break
                  p.write_text(s)

          # For the other known Xcalibur rejects, require the surrounding SUSFS symbols
          # to already exist from successfully applied hunks; otherwise stop here.
          checks = {
              Path('fs/namei.c.rej'): ('fs/namei.c', 'susfs'),
              Path('fs/notify/fdinfo.c.rej'): ('fs/notify/fdinfo.c', 'susfs'),
              Path('kernel/sys.c.rej'): ('kernel/sys.c', 'susfs'),
          }
          for rej, (src, marker) in checks.items():
              if rej in rejects:
                  text = Path(src).read_text(errors='ignore')
                  if marker not in text.lower():
                      print(f'{src}: known reject still needs manual adaptation', file=sys.stderr)
                      sys.exit(3)

          for p in rejects:
              p.unlink(missing_ok=True)
          PYFIX
          fi

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "Reject files remain" >&2
            find . -name '*.rej' -print >&2
            exit 1
          fi

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -R "SUSFS_VERSION" -n include/linux/susfs.h | head -n 2 | tee ../diagnostics/susfs-version.txt

          echo "Applying SUSFS legacy inline hooks for non-GKI 4.14..."
          curl -fL --retry 3 "${PATCH_BASE}/susfs_inline_hook_patches.sh" -o ../susfs-inline-hooks.sh
          chmod +x ../susfs-inline-hooks.sh

          set +e
          bash ../susfs-inline-hooks.sh 2>&1 | tee ../diagnostics/susfs-inline-hooks.log
          HOOK_RC=${PIPESTATUS[0]}
          set -e

          if [ "$HOOK_RC" -ne 0 ]; then
            echo "SUSFS inline-hook helper returned $HOOK_RC" >&2
            exit "$HOOK_RC"
          fi

          if grep -qiE 'patch failed|failed for unknown reasons|not found|cannot find' ../diagnostics/susfs-inline-hooks.log; then
            echo "Inline-hook helper reported a failed insertion" >&2
            cat ../diagnostics/susfs-inline-hooks.log >&2
            exit 1
          fi

          echo "Verifying BakaSU-required legacy hooks..."
          required_hooks=(
            "ksu_handle_setresuid"
            "ksu_handle_faccessat"
            "ksu_handle_stat"
            "ksu_handle_execveat"
            "ksu_handle_input_handle_event"
          )
          for hook in "${required_hooks[@]}"; do
            if ! grep -Rqs "$hook"               fs kernel drivers security arch/arm64 2>/dev/null; then
              echo "Missing required inline hook in kernel source: $hook" >&2
              exit 1
            fi
          done

          {
            echo "===== setresuid ====="
            grep -Rns "ksu_handle_setresuid" kernel fs drivers 2>/dev/null | head -n 10 || true
            echo "===== faccessat ====="
            grep -Rns "ksu_handle_faccessat" fs kernel 2>/dev/null | head -n 10 || true
            echo "===== stat ====="
            grep -Rns "ksu_handle_stat" fs kernel 2>/dev/null | head -n 10 || true
            echo "===== execveat ====="
            grep -Rns "ksu_handle_execveat" fs kernel 2>/dev/null | head -n 10 || true
            echo "===== input ====="
            grep -Rns "ksu_handle_input_handle_event" drivers 2>/dev/null | head -n 10 || true
          } > ../diagnostics/inline-hook-locations.txt

      - name: Configure BakaSU + SUSFS
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          DEF="arch/arm64/configs/$DEFCONFIG"
          test -f "$DEF"

          set_y() {
            local k="$1"
            sed -i -e "/^${k}=/d" -e "/^# ${k} is not set/d" "$DEF"
            echo "${k}=y" >> "$DEF"
          }
          set_n() {
            local k="$1"
            sed -i -e "/^${k}=/d" -e "/^# ${k} is not set/d" "$DEF"
            echo "# ${k} is not set" >> "$DEF"
          }

          set_y CONFIG_KSU
          set_y CONFIG_KSU_SUSFS
          set_n CONFIG_KSU_MANUAL_HOOK
          set_n CONFIG_KSU_TRACEPOINT_HOOK
          set_y CONFIG_KPROBES
          set_y CONFIG_KPROBE_EVENTS
          set_y CONFIG_KRETPROBES
          set_y CONFIG_OVERLAY_FS

          for k in \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do
            set_y "$k"
          done
          set_n CONFIG_KSU_SUSFS_ENABLE_LOG

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          CLANG_ROOT="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin"
          export PATH="/usr/lib/ccache:$CLANG_ROOT:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CC="ccache $CLANG_ROOT/clang"
          export CXX="ccache $CLANG_ROOT/clang++"
          export HOSTCC="ccache $CLANG_ROOT/clang"
          export HOSTCXX="ccache $CLANG_ROOT/clang++"
          export LD="$CLANG_ROOT/ld.lld"
          export AR="$CLANG_ROOT/llvm-ar"
          export NM="$CLANG_ROOT/llvm-nm"
          export OBJCOPY="$CLANG_ROOT/llvm-objcopy"
          export OBJDUMP="$CLANG_ROOT/llvm-objdump"
          export STRIP="$CLANG_ROOT/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          mkdir -p out
          touch .scmversion
          make O=out "$DEFCONFIG" CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out olddefconfig CLANG_TRIPLE=aarch64-linux-gnu-

          grep -E '^(CONFIG_THREAD_INFO_IN_TASK|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KPROBES|CONFIG_OVERLAY_FS)' out/.config \
            | tee "$GITHUB_WORKSPACE/diagnostics/final-config.txt"

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "Wrong KSU hook mode survived config" >&2
            exit 1
          fi

          set +e
          make -j"$(nproc)" O=out CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build.log"
          RC=${PIPESTATUS[0]}
          set -e
          exit "$RC"

      - name: Verify SUSFS in compiled image
        shell: bash
        run: |
          set -euxo pipefail
          IMG=kernel/out/arch/arm64/boot/Image.gz
          test -s "$IMG"
          gzip -dc "$IMG" > built-Image
          strings built-Image | grep -m1 'Linux version' | tee diagnostics/kernel-banner.txt || true
          strings built-Image | grep -Ei -m20 'susfs is initialized|susfs_show_version|susfs_add_sus_path|susfs_add_sus_map' \
            | tee diagnostics/susfs-markers.txt
          grep -q 'susfs is initialized' diagnostics/susfs-markers.txt

      - name: Package with known-good Sep-30 Xcalibur payload
        shell: bash
        run: |
          set -euxo pipefail
          test -d known-good-sep30
          rm -rf package
          cp -a known-good-sep30 package
          cp kernel/out/arch/arm64/boot/Image.gz package/Image.gz

          ZIP="Xcalibur-violet-BakaSU-${{ matrix.bakasu_ref }}-SUSFS-$(date +%Y%m%d-%H%M).zip"
          (cd package && zip -r9 "../$ZIP" .)
          sha256sum "$ZIP" > "$ZIP.sha256"
          cp kernel/out/.config "$ZIP.config"
          cp diagnostics/summary.txt "$ZIP.provenance.txt"
          {
            echo "kernel_sha=$KERNEL_SHA"
            echo "bakasu_ref=${{ matrix.bakasu_ref }}"
            echo "susfs_patch_commit=$SUSFS_PATCH_COMMIT"
            echo "compiler=$CLANG_VERSION"
          } >> "$ZIP.provenance.txt"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload successful candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: success-${{ matrix.bakasu_ref }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.ZIP }}.config
            ${{ env.ZIP }}.provenance.txt
            diagnostics/**

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.bakasu_ref }}
          path: |
            diagnostics/**
            kernel/**/*.rej
            kernel/**/*.orig
            susfs-4.14.patch
            susfs-inline-hooks.sh
          if-no-files-found: warn
