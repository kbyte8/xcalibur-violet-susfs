name: Xcalibur Violet - ReSukiSU + SUSFS 2.3

on:
  workflow_dispatch:

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r416183b"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  DEFCONFIG_NAME: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  KERNEL_NAME: "Xcalibur-violet-ReSukiSU-SUSFS"
  SUSFS_PATCH_COMMIT: "e2f895b"
  RESUKISU_BRANCH: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout modified builder
        uses: actions/checkout@v4

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xcalibur-violet-susfs
          max-size: 5G

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="10" -o Acquire::Retries="2" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential \
            lz4 git python3 curl dwarves cpio lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip patch

      - name: Clone exact Xcalibur source family
        run: |
          rm -rf kernel
          git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" kernel
          cd kernel
          echo "KERNEL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Kernel source: $(git rev-parse HEAD)"
          echo "Kernel version: $(make kernelversion)"

      - name: Download same Clang family as Sep-30 build
        run: |
          mkdir -p "toolchains/${CLANG_VERSION}"
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "toolchains/${CLANG_VERSION}"
          test -x "toolchains/${CLANG_VERSION}/bin/clang"
          "toolchains/${CLANG_VERSION}/bin/clang" --version | head -n 1

      - name: Integrate ReSukiSU
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cd kernel

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Justadeayo/sKernelSU/${RESUKISU_BRANCH}/kernel/setup.sh" \
            -o setup.sh

          bash setup.sh "${RESUKISU_BRANCH}" 2>&1 | tee ../resukisu-setup.log

          # setup.sh is authoritative: it creates drivers/kernelsu and wires
          # drivers/Makefile + drivers/Kconfig. Do not assume the clone dir name.
          if [ ! -L drivers/kernelsu ]; then
            echo "::error::ReSukiSU setup finished but drivers/kernelsu symlink is missing"
            ls -la drivers | tee ../diagnostics/drivers-list.txt
            exit 1
          fi

          KSU_KERNEL_DIR="$(readlink -f drivers/kernelsu)"
          if [ ! -d "$KSU_KERNEL_DIR" ]; then
            echo "::error::drivers/kernelsu points to a missing directory: $KSU_KERNEL_DIR"
            exit 1
          fi

          KSU_REPO_DIR="$(git -C "$KSU_KERNEL_DIR" rev-parse --show-toplevel 2>/dev/null || true)"
          if [ -z "$KSU_REPO_DIR" ]; then
            echo "::error::Could not determine ReSukiSU repository root from $KSU_KERNEL_DIR"
            exit 1
          fi

          RESUKISU_SHA="$(git -C "$KSU_REPO_DIR" rev-parse HEAD)"
          echo "RESUKISU_SHA=$RESUKISU_SHA" >> "$GITHUB_ENV"
          echo "KSU kernel dir: $KSU_KERNEL_DIR"
          echo "KSU repo dir:   $KSU_REPO_DIR"
          echo "KSU SHA:        $RESUKISU_SHA"

          test -f drivers/kernelsu/Kconfig
          if [ ! -f drivers/kernelsu/Kbuild ] && [ ! -f drivers/kernelsu/Makefile ]; then
            echo "::error::ReSukiSU kernel directory has neither Kbuild nor Makefile"
            exit 1
          fi

          grep -qE 'obj-\$\(CONFIG_KSU\).*kernelsu/' drivers/Makefile || {
            echo "::error::drivers/Makefile is not wired to drivers/kernelsu"
            tail -n 40 drivers/Makefile
            exit 1
          }
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::drivers/Kconfig is not wired to drivers/kernelsu/Kconfig"
            tail -n 60 drivers/Kconfig
            exit 1
          }

          if ! grep -q 'KSU_SUSFS' drivers/kernelsu/Kconfig; then
            echo "::error::Selected ReSukiSU tree does not expose SUSFS Kconfig options"
            exit 1
          fi

          {
            echo "KSU_KERNEL_DIR=$KSU_KERNEL_DIR"
            echo "KSU_REPO_DIR=$KSU_REPO_DIR"
            echo "RESUKISU_SHA=$RESUKISU_SHA"
            echo "===== drivers/Makefile KSU lines ====="
            grep -n 'kernelsu' drivers/Makefile || true
            echo "===== drivers/Kconfig KSU lines ====="
            grep -n 'kernelsu' drivers/Kconfig || true
            echo "===== KSU Kconfig SUSFS lines ====="
            grep -n 'KSU_SUSFS' drivers/kernelsu/Kconfig | head -80 || true
            echo "===== KSU build file ====="
            if [ -f drivers/kernelsu/Kbuild ]; then
              sed -n '1,220p' drivers/kernelsu/Kbuild
            else
              sed -n '1,220p' drivers/kernelsu/Makefile
            fi
          } > ../diagnostics/resukisu-integration.txt

      - name: Download and apply SUSFS 2.3 kernel patches
        run: |
          set -e
          cd kernel
          PATCH_BASE="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_COMMIT}/Patches"
          curl -fL --retry 3 "${PATCH_BASE}/Patch/susfs_patch_to_4.14.patch" -o ../susfs-4.14.patch
          curl -fL --retry 3 "${PATCH_BASE}/susfs_inline_hook_patches.sh" -o ../susfs-inline-hooks.sh
          chmod +x ../susfs-inline-hooks.sh

          echo "Applying main 4.14 SUSFS patch..."
          set +e
          patch -p1 --forward --batch < ../susfs-4.14.patch 2>&1 | tee ../susfs-main-patch.log
          PATCH_RC=${PIPESTATUS[0]}
          set -e

          if [ "$PATCH_RC" -ne 0 ]; then
            mapfile -t rejects < <(find . -name '*.rej' -print | sort)
            printf 'Rejects found:\n%s\n' "${rejects[*]}"

            expected1='./fs/proc/cmdline.c.rej'
            expected2='./fs/proc/task_mmu.c.rej'
            if [ "${#rejects[@]}" -ne 2 ] || \
               [ "${rejects[0]}" != "$expected1" ] || \
               [ "${rejects[1]}" != "$expected2" ]; then
              echo "::error::Unexpected SUSFS patch rejects. Refusing to continue."
              for f in "${rejects[@]}"; do
                echo "===== $f ====="
                cat "$f"
              done
              exit 1
            fi

            echo "Applying Xcalibur-specific merge for /proc/cmdline and task_mmu include..."
            python3 - <<'PYFIX'
from pathlib import Path

p = Path('fs/proc/cmdline.c')
s = p.read_text()

decls = '''
#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;
extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
#endif
'''
if 'susfs_is_fake_cmdline_or_bootconfig_buffer_set' not in s:
    anchor = '#include <asm/setup.h>\n'
    if anchor not in s:
        raise SystemExit('cmdline.c: include anchor not found')
    s = s.replace(anchor, anchor + decls, 1)

spoof = '''#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {
\t\tsusfs_spoof_cmdline_or_bootconfig(m);
\t\tseq_putc(m, '\\n');
\t\treturn 0;
\t}
#endif
'''
fn = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
if 'susfs_spoof_cmdline_or_bootconfig(m);' not in s:
    if fn not in s:
        raise SystemExit('cmdline.c: cmdline_proc_show anchor not found')
    s = s.replace(fn, fn + spoof, 1)
p.write_text(s)

p = Path('fs/proc/task_mmu.c')
s = p.read_text()
inc = '''#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
#include <linux/susfs_def.h>
#endif // SUSFS task_mmu helpers
'''
if '#include <linux/susfs_def.h>' not in s:
    anchor = '#include <linux/ctype.h>\n'
    if anchor not in s:
        raise SystemExit('task_mmu.c: include anchor not found')
    s = s.replace(anchor, anchor + inc, 1)
p.write_text(s)
PYFIX

            rm -f fs/proc/cmdline.c.rej fs/proc/task_mmu.c.rej
            grep -q 'susfs_spoof_cmdline_or_bootconfig(m)' fs/proc/cmdline.c || { echo "::error::Xcalibur cmdline SUSFS merge failed"; exit 1; }
            grep -q '#include <linux/susfs_def.h>' fs/proc/task_mmu.c || { echo "::error::Xcalibur task_mmu SUSFS merge failed"; exit 1; }
          fi

          REJECTS="$(find . -name '*.rej' -print)"
          if [ -n "$REJECTS" ]; then
            echo "::error::Unexpected patch reject files remain:"
            echo "$REJECTS"
            exit 1
          fi

          echo "Applying legacy/non-GKI inline hooks..."
          bash ../susfs-inline-hooks.sh 2>&1 | tee ../susfs-inline-hooks.log

          if grep -q "patch failed for unknown reasons" ../susfs-inline-hooks.log; then
            echo "::error::The inline-hook helper reported at least one failed hook insertion."
            exit 1
          fi

          grep -q 'ksu_handle_execveat_sucompat' fs/exec.c || { echo "::error::exec hook missing"; exit 1; }
          grep -q 'ksu_handle_faccessat' fs/open.c || { echo "::error::faccessat hook missing"; exit 1; }
          grep -q 'ksu_handle_stat' fs/stat.c || { echo "::error::stat hook missing"; exit 1; }
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c || { echo "::error::input hook missing"; exit 1; }
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c || { echo "::error::reboot hook missing"; exit 1; }

          sha256sum ../susfs-4.14.patch ../susfs-inline-hooks.sh > ../susfs-patches.sha256
          test -f fs/susfs.c
          test -f include/linux/susfs.h

      - name: Configure KSU and SUSFS
        run: |
          set -e
          cd kernel
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"
          test -f "$DEFCONFIG"

          set_y() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=y" >> "$DEFCONFIG"
          }
          set_n() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "# ${key} is not set" >> "$DEFCONFIG"
          }

          set_y CONFIG_KSU
          set_y CONFIG_KPROBES
          set_y CONFIG_KPROBE_EVENTS
          set_y CONFIG_KRETPROBES
          set_y CONFIG_OVERLAY_FS

          # ReSukiSU SUSFS inline-hook mode. Do not enable a second hook mode.
          set_y CONFIG_KSU_SUSFS
          set_n CONFIG_KSU_MANUAL_HOOK
          set_n CONFIG_KSU_TRACEPOINT_HOOK
          set_n CONFIG_KSU_KPROBES_HOOK

          set_y CONFIG_KSU_SUSFS_SUS_PATH
          set_y CONFIG_KSU_SUSFS_SUS_MOUNT
          set_y CONFIG_KSU_SUSFS_SUS_KSTAT
          set_y CONFIG_KSU_SUSFS_SPOOF_UNAME
          set_n CONFIG_KSU_SUSFS_ENABLE_LOG
          set_y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          set_y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          set_y CONFIG_KSU_SUSFS_OPEN_REDIRECT
          set_y CONFIG_KSU_SUSFS_SUS_MAP

          tail -n 50 "$DEFCONFIG"

      - name: Compile kernel
        run: |
          set -e
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${CLANG_VERSION}/bin"
          export PATH="/usr/lib/ccache:${CLANG_ROOT}:$PATH"
          export CC="ccache ${CLANG_ROOT}/clang"
          export CXX="ccache ${CLANG_ROOT}/clang++"
          export HOSTCC="ccache ${CLANG_ROOT}/clang"
          export HOSTCXX="ccache ${CLANG_ROOT}/clang++"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          mkdir -p out
          touch ./.scmversion
          make O=out "${DEFCONFIG_NAME}" CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out olddefconfig CLANG_TRIPLE=aarch64-linux-gnu-

          cp out/.config ../diagnostics/final.config
          echo "===== Final KSU / SUSFS config ====="
          grep -E '^(CONFIG_THREAD_INFO_IN_TASK|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_OVERLAY_FS)' out/.config || true
          echo "===================================="

          required=(
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )
          for key in "${required[@]}"; do
            if ! grep -q "^${key}=y$" out/.config; then
              echo "::error::${key}=y is missing from final .config"
              exit 1
            fi
          done

          set +e
          make -j"$(nproc)" O=out CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          status=${PIPESTATUS[0]}
          set -e

          # Capture KSU object symbol information even if final link fails.
          if [ -f out/drivers/kernelsu/ksu.o ]; then
            "${CLANG_ROOT}/llvm-nm" out/drivers/kernelsu/ksu.o 2>/dev/null | \
              grep -E 'ksu_handle_|ksu_su_compat|ksu_is_init_rc|ksu_is_input' \
              > ../diagnostics/ksu-object-symbols.txt || true
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::Kernel compilation failed"
            exit "$status"
          fi

      - name: Verify built kernel really contains SUSFS
        run: |
          set -e
          BOOT_DIR="kernel/out/arch/arm64/boot"
          test -s "${BOOT_DIR}/Image.gz"
          gzip -dc "${BOOT_DIR}/Image.gz" > built-Image

          strings built-Image | grep -m1 -A1 'Linux version' || true
          strings built-Image | grep -Ei -m10 'susfs is initialized|susfs_show_version|susfs_add_sus_path|susfs_add_sus_map' || true

          if ! strings built-Image | grep -q 'susfs is initialized'; then
            echo "::error::Compiled image does not contain the SUSFS init marker"
            exit 1
          fi

      - name: Package with known-good Sep-30 DTB/DTBO
        run: |
          set -e
          rm -rf package
          cp -a known-good-sep30 package
          cp kernel/out/arch/arm64/boot/Image.gz package/Image.gz

          echo '5c48d4b4d2112c9af8a2f9b543996bb410eb6ddc6a2fd65c02101a46b8e68569  package/dtb' | sha256sum -c -
          echo '1cb8c6023fee3a1a75624129bff66552e165e2328903a8fbefe68306253d77ad  package/dtbo.img' | sha256sum -c -

          ZIP_NAME="${KERNEL_NAME}_2.3_$(date +'%Y%m%d_%H%M')"
          (cd package && zip -r9 "../${ZIP_NAME}.zip" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          sha256sum "${ZIP_NAME}.zip" | tee "${ZIP_NAME}.sha256"
          cp kernel/out/.config "${ZIP_NAME}.config"
          printf '%s\n' \
            "kernel_source=${KERNEL_SOURCE}" \
            "kernel_ref=${KERNEL_BRANCH}" \
            "kernel_source_sha=${KERNEL_SOURCE_SHA}" \
            "resukisu_repo_detected_via=drivers/kernelsu" \
            "resukisu_ref=${RESUKISU_BRANCH}" \
            "resukisu_sha=${RESUKISU_SHA}" \
            "susfs_patch_commit=${SUSFS_PATCH_COMMIT}" \
            "compiler=${CLANG_VERSION}" \
            > "${ZIP_NAME}.provenance.txt"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-violet-resukisu-susfs
          path: |
            ${{ env.ZIP_NAME }}.zip
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.ZIP_NAME }}.config
            ${{ env.ZIP_NAME }}.provenance.txt
            susfs-patches.sha256

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-susfs-failure-logs
          path: |
            resukisu-setup.log
            diagnostics/**
            susfs-main-patch.log
            susfs-4.14.patch
            susfs-inline-hooks.log
            build.log
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: warn
