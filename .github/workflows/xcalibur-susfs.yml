name: Xcalibur Violet - KernelSU + SUSFS 2.3

on:
  workflow_dispatch:

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r416183b"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  DEFCONFIG_NAME: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  KERNEL_NAME: "Xcalibur-violet-KernelSU-SUSFS"
  KSU_REF: "master"
  SUSFS_PATCH_COMMIT: "e2f895b"
  SUSFS_UPSTREAM_BRANCH: "gki-android14-6.1"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: |
          mkdir -p diagnostics
          {
            echo "workflow=v6-kernelsu-susfs"
            echo "kernel_source=${KERNEL_SOURCE}"
            echo "kernel_branch=${KERNEL_BRANCH}"
            echo "ksu_repo=https://github.com/Justadeayo/KernelSU"
            echo "ksu_ref=${KSU_REF}"
            echo "susfs_kernel_patch_commit=${SUSFS_PATCH_COMMIT}"
          } > diagnostics/build-plan.txt

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xcalibur-violet-kernelsu-susfs-v6
          max-size: 5G

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="10" -o Acquire::Retries="2" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential \
            lz4 git python3 curl dwarves cpio lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip patch

      - name: Clone Xcalibur source
        run: |
          set -euo pipefail
          rm -rf kernel
          git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_SOURCE}" kernel
          cd kernel
          KERNEL_SOURCE_SHA="$(git rev-parse HEAD)"
          echo "KERNEL_SOURCE_SHA=${KERNEL_SOURCE_SHA}" >> "$GITHUB_ENV"
          {
            echo "kernel_source_sha=${KERNEL_SOURCE_SHA}"
            echo "kernel_version=$(make kernelversion)"
          } >> ../diagnostics/build-plan.txt
          make kernelversion

      - name: Download Sep-30 Clang family
        run: |
          set -euo pipefail
          mkdir -p "toolchains/${CLANG_VERSION}"
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "toolchains/${CLANG_VERSION}"
          test -x "toolchains/${CLANG_VERSION}/bin/clang"
          "toolchains/${CLANG_VERSION}/bin/clang" --version | head -n 1 | tee diagnostics/clang.txt

      - name: Integrate the same Justadeayo KernelSU family
        run: |
          set -euo pipefail
          cd kernel

          # This is intentionally the same setup path used by the user's
          # known-working Sep-30 Xcalibur v3.3.0-18 builder.
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/${KSU_REF}/kernel/setup.sh" \
            -o setup.sh
          sed -i 's|backslashxx/KernelSU|Justadeayo/KernelSU|g' setup.sh
          bash setup.sh "${KSU_REF}" 2>&1 | tee ../kernelsu-setup.log

          if [ ! -L drivers/kernelsu ]; then
            echo "::error::KernelSU setup completed but drivers/kernelsu symlink is missing"
            ls -la drivers > ../diagnostics/drivers-list.txt
            exit 1
          fi

          KSU_KERNEL_DIR="$(readlink -f drivers/kernelsu)"
          KSU_REPO_DIR="$(git -C "$KSU_KERNEL_DIR" rev-parse --show-toplevel 2>/dev/null || true)"
          if [ -z "$KSU_REPO_DIR" ] || [ ! -d "$KSU_REPO_DIR" ]; then
            echo "::error::Could not resolve KernelSU repository from drivers/kernelsu"
            exit 1
          fi

          KSU_SHA="$(git -C "$KSU_REPO_DIR" rev-parse HEAD)"
          KSU_VERSION="$(grep -E '^KSU_VERSION[[:space:]]*[:?+]?=' "$KSU_REPO_DIR/Makefile" 2>/dev/null | head -n1 | sed -E 's/.*=[[:space:]]*//' || true)"
          echo "KSU_KERNEL_DIR=${KSU_KERNEL_DIR}" >> "$GITHUB_ENV"
          echo "KSU_REPO_DIR=${KSU_REPO_DIR}" >> "$GITHUB_ENV"
          echo "KSU_SHA=${KSU_SHA}" >> "$GITHUB_ENV"
          echo "KSU_VERSION_DETECTED=${KSU_VERSION}" >> "$GITHUB_ENV"

          {
            echo "ksu_repo_dir=${KSU_REPO_DIR}"
            echo "ksu_kernel_dir=${KSU_KERNEL_DIR}"
            echo "ksu_sha=${KSU_SHA}"
            echo "ksu_version_detected=${KSU_VERSION}"
            echo "===== drivers/Makefile ====="
            grep -n 'kernelsu' drivers/Makefile || true
            echo "===== drivers/Kconfig ====="
            grep -n 'kernelsu' drivers/Kconfig || true
            echo "===== current KSU hook symbols in source ====="
            grep -RhoE 'ksu_handle_[A-Za-z0-9_]+' "$KSU_KERNEL_DIR" 2>/dev/null | sort -u || true
          } > ../diagnostics/kernelsu-before-susfs.txt

          grep -qE 'obj-\$\(CONFIG_KSU\).*kernelsu/' drivers/Makefile || {
            echo "::error::KernelSU is not wired into drivers/Makefile"
            exit 1
          }
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::KernelSU is not wired into drivers/Kconfig"
            exit 1
          }

      - name: Fetch SUSFS 2.3 KernelSU-side integration
        run: |
          set -euo pipefail
          rm -rf susfs-upstream
          git clone --depth=1 -b "${SUSFS_UPSTREAM_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs-upstream

          SUSFS_UPSTREAM_SHA="$(git -C susfs-upstream rev-parse HEAD)"
          echo "SUSFS_UPSTREAM_SHA=${SUSFS_UPSTREAM_SHA}" >> "$GITHUB_ENV"
          echo "susfs_upstream_sha=${SUSFS_UPSTREAM_SHA}" >> diagnostics/build-plan.txt

          test -s susfs-upstream/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cp susfs-upstream/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            ksu-enable-susfs.patch

          # Newer SUSFS trees may ship a matching sucompat.h. Follow upstream's
          # non-GKI instructions if it exists, but save the original first.
          if [ -f susfs-upstream/kernel_patches/KernelSU/kernel/sucompat.h ]; then
            cp "${KSU_KERNEL_DIR}/sucompat.h" diagnostics/ksu-sucompat-before.h 2>/dev/null || true
            cp susfs-upstream/kernel_patches/KernelSU/kernel/sucompat.h \
              "${KSU_KERNEL_DIR}/sucompat.h"
          fi

          set +e
          (
            cd "${KSU_REPO_DIR}"
            patch -p1 --forward --batch < "${GITHUB_WORKSPACE}/ksu-enable-susfs.patch"
          ) 2>&1 | tee ksu-susfs-patch.log
          KSU_PATCH_RC=${PIPESTATUS[0]}
          set -e

          find "${KSU_REPO_DIR}" -name '*.rej' -print -exec sh -c \
            'echo "===== $1 ====="; cat "$1"' _ {} \; > diagnostics/ksu-patch-rejects.txt || true

          if [ "$KSU_PATCH_RC" -ne 0 ]; then
            echo "::error::SUSFS KernelSU-side patch did not apply cleanly to Justadeayo/KernelSU"
            exit 1
          fi

          if ! grep -q 'config KSU_SUSFS' "${KSU_KERNEL_DIR}/Kconfig"; then
            echo "::error::KernelSU-side SUSFS patch applied but CONFIG_KSU_SUSFS is missing"
            exit 1
          fi

          {
            echo "===== SUSFS Kconfig after patch ====="
            grep -n 'KSU_SUSFS' "${KSU_KERNEL_DIR}/Kconfig" || true
            echo "===== KSU hook symbols after SUSFS patch ====="
            grep -RhoE 'ksu_handle_[A-Za-z0-9_]+' "${KSU_KERNEL_DIR}" 2>/dev/null | sort -u || true
          } > diagnostics/kernelsu-after-susfs.txt

      - name: Apply SUSFS 2.3 Linux 4.14 kernel patch
        run: |
          set -euo pipefail
          cd kernel
          PATCH_BASE="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_COMMIT}/Patches"
          curl -fL --retry 3 "${PATCH_BASE}/Patch/susfs_patch_to_4.14.patch" \
            -o ../susfs-4.14.patch

          set +e
          patch -p1 --forward --batch < ../susfs-4.14.patch 2>&1 | tee ../susfs-main-patch.log
          PATCH_RC=${PIPESTATUS[0]}
          set -e

          # Xcalibur branch 17 has exactly two known layout differences from
          # this generic 4.14 backport. Merge only those known rejects.
          if [ "$PATCH_RC" -ne 0 ]; then
            mapfile -t rejects < <(find . -name '*.rej' -print | sort)
            printf 'Rejects found:\n%s\n' "${rejects[*]}"

            expected1='./fs/proc/cmdline.c.rej'
            expected2='./fs/proc/task_mmu.c.rej'
            if [ "${#rejects[@]}" -ne 2 ] || \
               [ "${rejects[0]}" != "$expected1" ] || \
               [ "${rejects[1]}" != "$expected2" ]; then
              echo "::error::Unexpected SUSFS kernel patch rejects"
              for f in "${rejects[@]}"; do
                echo "===== $f ====="
                cat "$f"
              done
              exit 1
            fi

            python3 - <<'PYFIX'
          from pathlib import Path

          p = Path('fs/proc/cmdline.c')
          s = p.read_text()
          decls = '''
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;
          extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
          #endif
          '''
          if 'susfs_is_fake_cmdline_or_bootconfig_buffer_set' not in s:
              anchor = '#include <asm/setup.h>\n'
              if anchor not in s:
                  raise SystemExit('cmdline.c: include anchor not found')
              s = s.replace(anchor, anchor + decls, 1)

          spoof = '''#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          \tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {
          \t\tsusfs_spoof_cmdline_or_bootconfig(m);
          \t\tseq_putc(m, '\\n');
          \t\treturn 0;
          \t}
          #endif
          '''
          fn = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
          if 'susfs_spoof_cmdline_or_bootconfig(m);' not in s:
              if fn not in s:
                  raise SystemExit('cmdline.c: cmdline_proc_show anchor not found')
              s = s.replace(fn, fn + spoof, 1)
          p.write_text(s)

          p = Path('fs/proc/task_mmu.c')
          s = p.read_text()
          inc = '''#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
          #include <linux/susfs_def.h>
          #endif // SUSFS task_mmu helpers
          '''
          if '#include <linux/susfs_def.h>' not in s:
              anchor = '#include <linux/ctype.h>\n'
              if anchor not in s:
                  raise SystemExit('task_mmu.c: include anchor not found')
              s = s.replace(anchor, anchor + inc, 1)
          p.write_text(s)
          PYFIX

            rm -f fs/proc/cmdline.c.rej fs/proc/task_mmu.c.rej
          fi

          REMAINING="$(find . -name '*.rej' -print)"
          if [ -n "$REMAINING" ]; then
            echo "::error::Unexpected SUSFS reject files remain"
            echo "$REMAINING"
            exit 1
          fi

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          SUSFS_VERSION_LINE="$(grep -E '^#define[[:space:]]+SUSFS_VERSION' include/linux/susfs.h | head -n1 || true)"
          echo "${SUSFS_VERSION_LINE}" | tee ../diagnostics/susfs-version.txt
          if ! echo "$SUSFS_VERSION_LINE" | grep -Eq 'v2\.[23]\.'; then
            echo "::error::Expected SUSFS >=2.2; detected: ${SUSFS_VERSION_LINE:-unknown}"
            exit 1
          fi

          sha256sum ../susfs-4.14.patch ../ksu-enable-susfs.patch > ../susfs-patches.sha256

      - name: Configure original KernelSU hooks plus SUSFS
        run: |
          set -euo pipefail
          cd kernel
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"
          test -f "$DEFCONFIG"

          set_y() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=y" >> "$DEFCONFIG"
          }
          set_n() {
            key="$1"
            sed -i -e "/^${key}=/d" -e "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "# ${key} is not set" >> "$DEFCONFIG"
          }
          ksu_symbol_exists() {
            local sym="${1#CONFIG_}"
            grep -Eq "^[[:space:]]*(menu)?config[[:space:]]+${sym}([[:space:]]|$)" "${KSU_KERNEL_DIR}/Kconfig"
          }
          set_y_if_exists() {
            if ksu_symbol_exists "$1"; then
              set_y "$1"
              echo "enabled optional $1"
            else
              echo "optional $1 not present in this KSU tree"
            fi
          }
          set_n_if_exists() {
            if ksu_symbol_exists "$1"; then
              set_n "$1"
              echo "disabled optional $1"
            fi
          }

          # Preserve the root hook strategy from the known-good Sep-30 build.
          set_y CONFIG_KSU
          set_y CONFIG_KPROBES
          set_y CONFIG_KPROBE_EVENTS
          set_y CONFIG_KSU_KPROBE_HOOKS
          set_y CONFIG_OVERLAY_FS
          set_y CONFIG_KSU_TAMPER_SYSCALL_TABLE

          # Add SUSFS, without changing the existing KSU hook family.
          set_y CONFIG_KSU_SUSFS
          set_y_if_exists CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_PATH
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_KSTAT
          set_y_if_exists CONFIG_KSU_SUSFS_TRY_UMOUNT
          set_y_if_exists CONFIG_KSU_SUSFS_SPOOF_UNAME
          set_y_if_exists CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          set_y_if_exists CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          set_y_if_exists CONFIG_KSU_SUSFS_OPEN_REDIRECT
          set_y_if_exists CONFIG_KSU_SUSFS_SUS_MAP
          set_n_if_exists CONFIG_KSU_SUSFS_ENABLE_LOG
          set_n_if_exists CONFIG_KSU_SUSFS_SUS_SU

          tail -n 80 "$DEFCONFIG" > ../diagnostics/defconfig-tail.txt

      - name: Compile kernel
        run: |
          set -euo pipefail
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${CLANG_VERSION}/bin"
          export PATH="/usr/lib/ccache:${CLANG_ROOT}:$PATH"
          export CC="ccache ${CLANG_ROOT}/clang"
          export CXX="ccache ${CLANG_ROOT}/clang++"
          export HOSTCC="ccache ${CLANG_ROOT}/clang"
          export HOSTCXX="ccache ${CLANG_ROOT}/clang++"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          mkdir -p out
          touch ./.scmversion
          make O=out "${DEFCONFIG_NAME}" CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out olddefconfig CLANG_TRIPLE=aarch64-linux-gnu-
          cp out/.config ../diagnostics/final.config

          echo "===== Final KernelSU / SUSFS config ====="
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBE_HOOKS|CONFIG_KSU_TAMPER_SYSCALL_TABLE|CONFIG_KPROBES|CONFIG_OVERLAY_FS)' out/.config || true
          echo "========================================="

          required=(
            CONFIG_KSU
            CONFIG_KPROBES
            CONFIG_KPROBE_EVENTS
            CONFIG_KSU_KPROBE_HOOKS
            CONFIG_OVERLAY_FS
            CONFIG_KSU_TAMPER_SYSCALL_TABLE
            CONFIG_KSU_SUSFS
          )
          for key in "${required[@]}"; do
            if ! grep -q "^${key}=y$" out/.config; then
              echo "::error::${key}=y is missing from final .config"
              exit 1
            fi
          done

          set +e
          make -j"$(nproc)" O=out CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Kernel compilation failed"
            exit "$status"
          fi

      - name: Verify built image contains KernelSU and SUSFS
        run: |
          set -euo pipefail
          BOOT_DIR="kernel/out/arch/arm64/boot"
          test -s "${BOOT_DIR}/Image.gz"
          gzip -dc "${BOOT_DIR}/Image.gz" > built-Image

          {
            echo "===== kernel banner ====="
            strings built-Image | grep -m1 'Linux version' || true
            echo "===== SUSFS markers ====="
            strings built-Image | grep -Ei -m20 'susfs is initialized|susfs_show_version|susfs_add_sus_path|susfs_add_sus_map|SUSFS_VERSION' || true
            echo "===== KernelSU markers ====="
            strings built-Image | grep -Ei -m20 'KernelSU:|selinux_hide|KSU ioctl' || true
          } | tee diagnostics/built-image-markers.txt

          strings built-Image | grep -q 'susfs is initialized' || {
            echo "::error::Built kernel has no SUSFS init marker"
            exit 1
          }
          strings built-Image | grep -q 'KernelSU:' || {
            echo "::error::Built kernel has no KernelSU marker"
            exit 1
          }

      - name: Package with proven Sep-30 DTB DTBO and installer
        run: |
          set -euo pipefail
          rm -rf package
          cp -a known-good-sep30 package
          cp kernel/out/arch/arm64/boot/Image.gz package/Image.gz

          echo '5c48d4b4d2112c9af8a2f9b543996bb410eb6ddc6a2fd65c02101a46b8e68569  package/dtb' | sha256sum -c -
          echo '1cb8c6023fee3a1a75624129bff66552e165e2328903a8fbefe68306253d77ad  package/dtbo.img' | sha256sum -c -

          ZIP_NAME="${KERNEL_NAME}_2.3_$(date +'%Y%m%d_%H%M')"
          (cd package && zip -r9 "../${ZIP_NAME}.zip" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          sha256sum "${ZIP_NAME}.zip" | tee "${ZIP_NAME}.sha256"
          cp kernel/out/.config "${ZIP_NAME}.config"

          printf '%s\n' \
            "kernel_source=${KERNEL_SOURCE}" \
            "kernel_ref=${KERNEL_BRANCH}" \
            "kernel_source_sha=${KERNEL_SOURCE_SHA}" \
            "ksu_repo=https://github.com/Justadeayo/KernelSU" \
            "ksu_ref=${KSU_REF}" \
            "ksu_sha=${KSU_SHA}" \
            "ksu_version_detected=${KSU_VERSION_DETECTED}" \
            "susfs_upstream_branch=${SUSFS_UPSTREAM_BRANCH}" \
            "susfs_upstream_sha=${SUSFS_UPSTREAM_SHA}" \
            "susfs_4.14_patch_commit=${SUSFS_PATCH_COMMIT}" \
            "compiler=${CLANG_VERSION}" \
            "known_good_sep30_package_sha256=858e34f51bbef6ae9ae5e9fbdc1571b91845eca0cd2ad1800a7bad281d33b569" \
            > "${ZIP_NAME}.provenance.txt"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-violet-kernelsu-susfs
          path: |
            ${{ env.ZIP_NAME }}.zip
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.ZIP_NAME }}.config
            ${{ env.ZIP_NAME }}.provenance.txt
            susfs-patches.sha256
            diagnostics/built-image-markers.txt

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          cp kernelsu-setup.log diagnostics/ 2>/dev/null || true
          cp ksu-susfs-patch.log diagnostics/ 2>/dev/null || true
          cp susfs-main-patch.log diagnostics/ 2>/dev/null || true
          cp susfs-4.14.patch diagnostics/ 2>/dev/null || true
          cp ksu-enable-susfs.patch diagnostics/ 2>/dev/null || true
          cp build.log diagnostics/ 2>/dev/null || true
          find kernel -name '*.rej' -exec cp --parents '{}' diagnostics/ \; 2>/dev/null || true
          find kernel -name '*.orig' -exec cp --parents '{}' diagnostics/ \; 2>/dev/null || true
          if [ -n "${KSU_REPO_DIR:-}" ] && [ -d "${KSU_REPO_DIR:-}" ]; then
            grep -RhoE 'ksu_handle_[A-Za-z0-9_]+' "${KSU_KERNEL_DIR:-$KSU_REPO_DIR}" 2>/dev/null | sort -u \
              > diagnostics/ksu-hook-symbols-at-failure.txt || true
          fi
          find diagnostics -maxdepth 5 -type f -printf '%p\n' | sort

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-susfs-failure-logs
          path: diagnostics/
          if-no-files-found: error
