name: Xcalibur SUSFS history probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Probe exact KernelSU and builder history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report

          echo '=== Clone full Justadeayo KernelSU history ==='
          git clone --filter=blob:none https://github.com/Justadeayo/KernelSU.git ksu
          git -C ksu fetch --all --tags --prune

          {
            echo '=== KernelSU refs ==='
            git -C ksu show-ref --heads --tags || true
            echo
            echo '=== KernelSU commits around Sep 30 2026 ==='
            git -C ksu log --all --since='2026-09-20 00:00:00' --until='2026-10-05 23:59:59' \
              --date=iso-strict --format='%H | %ad | %D | %s' || true
            echo
            echo '=== Commits whose kernel/Makefile history mentions 32656 ==='
            git -C ksu log --all -S'32656' --date=iso-strict \
              --format='%H | %ad | %D | %s' -- kernel/Makefile || true
          } > report/kernelsu-history.txt

          {
            echo '=== Version lines for commits around Sep 30 ==='
            for sha in $(git -C ksu rev-list --all --since='2026-09-20 00:00:00' --until='2026-10-05 23:59:59'); do
              echo
              echo "--- $sha ---"
              git -C ksu show -s --date=iso-strict --format='%H | %ad | %D | %s' "$sha" || true
              git -C ksu show "$sha:kernel/Makefile" 2>/dev/null \
                | grep -nE 'KSU_VERSION|CFLAGS_ksu|VERSION' | head -30 || true
            done
          } > report/kernelsu-version-window.txt

          echo '=== Clone full KSU_Builder history ==='
          git clone --filter=blob:none https://github.com/Justadeayo/KSU_Builder.git builder
          git -C builder fetch --all --tags --prune

          {
            echo '=== Builder commits Aug 28 - Sep 12 2026 ==='
            git -C builder log --all --since='2026-08-28 00:00:00' --until='2026-09-12 23:59:59' \
              --date=iso-strict --format='%H | %ad | %D | %s' || true
          } > report/builder-history.txt

          mkdir -p report/builder-susfs-snapshots
          : > report/builder-susfs-matches.txt

          for sha in $(git -C builder rev-list --all --since='2026-08-28 00:00:00' --until='2026-09-12 23:59:59'); do
            matches=$(git -C builder grep -niE 'susfs|sus_fs|simonpunk|NonGKI_Kernel_Build' "$sha" -- .github/workflows 2>/dev/null || true)
            if [ -n "$matches" ]; then
              short=$(git -C builder rev-parse --short=12 "$sha")
              mkdir -p "report/builder-susfs-snapshots/$short"
              {
                echo "===== $sha ====="
                git -C builder show -s --date=iso-strict --format='%H | %ad | %D | %s' "$sha"
                echo "$matches"
                echo
              } >> report/builder-susfs-matches.txt

              for f in \
                .github/workflows/kernel.yml \
                .github/workflows/kernel_build.yml \
                .github/workflows/Kernel_\&_Manager_build.yml \
                .github/workflows/automated.yml; do
                safe=$(basename "$f")
                git -C builder show "$sha:$f" > "report/builder-susfs-snapshots/$short/$safe" 2>/dev/null || true
              done
            fi
          done

          {
            echo '=== Current KernelSU master ==='
            git -C ksu rev-parse origin/master 2>/dev/null || true
            echo '=== Current builder dev ==='
            git -C builder rev-parse origin/dev 2>/dev/null || true
            echo '=== Snapshot directories ==='
            find report/builder-susfs-snapshots -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort || true
          } > report/summary.txt

          echo '===== SUMMARY ====='
          cat report/summary.txt
          echo '===== KSU VERSION WINDOW ====='
          cat report/kernelsu-version-window.txt
          echo '===== BUILDER SUSFS MATCHES ====='
          cat report/builder-susfs-matches.txt

      - name: Upload history probe
        uses: actions/upload-artifact@v4
        with:
          name: xcalibur-susfs-history-probe
          path: report/
          if-no-files-found: error
